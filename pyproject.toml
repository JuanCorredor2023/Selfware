[project]
name = "selfware"
version = "0.1.0"
description = "Atlas: personal-context assistant comparing flat vs PARA retrieval over your own email"
readme = "README.md"
authors = [
    { name = "dianagrz", email = "dianagarza013@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # ingest/
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "mail-parser-reply>=1.36",
    # core/
    "pydantic>=2.13.5",
    "openai",
    "python-dotenv",
    # context/
    "chromadb",
    # api/
    "fastapi",
    "uvicorn[standard]",
    # observability/
    "opentelemetry-api",
    "opentelemetry-sdk",
    # eval/ -- these three pins keep RAGAS working (integration_p3.md D2, D30).
    # Don't loosen them without reading why:
    # ragas: 0.3.9+ depends on `instructor`, which pins openai<2.0.0, and the
    # rest of the project runs on openai 3.x. This is what the resolver
    # produces, not a preference.
    "ragas==0.3.1",
    # ragas 0.3.1 imports `langchain_community.chat_models.vertexai`, which
    # 0.4 removed. Upgrading this breaks the whole evaluation at import time.
    "langchain-community<0.4",
    # ragas 0.3.1 imports PIL without declaring it as a dependency.
    "pillow",
]

[project.scripts]
selfware = "selfware:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",  # fastapi.testclient
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
