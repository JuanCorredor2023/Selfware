[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-context"
version = "0.1.0"
description = "Carril de contexto y recuperación (PARA vs plano) del proyecto Atlas"
requires-python = ">=3.11"
dependencies = [
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]