[project]
name = "selfware"
version = "0.1.0"
description = "Atlas: personal-context assistant comparing flat vs PARA retrieval over your own email"
readme = "README.md"
authors = [
    { name = "dianagrz", email = "dianagarza013@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # ingest/
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "mail-parser-reply>=1.36",
    # core/
    "pydantic>=2.13.5",
    "openai",
    "python-dotenv",
    # context/
    "chromadb",
    # api/
    "fastapi",
    "uvicorn[standard]",
    # observability/
    "opentelemetry-api",
    "opentelemetry-sdk",
    # eval/ (Person 3). Read before upgrading any of these four: they hold each
    # other up (D30, re-measured on Python 3.14 on 4 Oct; see docs/integration_p3.md, D2).
    # ragas: 0.3.1 exactly. From 0.3.9 it depends on `instructor`, which caps
    #   `openai` far below the 3.x SDK `core/llm.py` is built on.
    "ragas==0.3.1",
    # langchain-community: ragas 0.3.1 imports
    #   `langchain_community.chat_models.vertexai`, which 0.4 removed. The resolver
    #   will NOT stop an upgrade: the break only shows at import time.
    "langchain-community<0.4",
    # pillow: ragas 0.3.1 imports PIL without declaring it.
    "pillow>=12.3.0",
    # scipy: Wilcoxon signed-rank test for the paired design (D18).
    "scipy>=1.18.1",
]

[project.scripts]
selfware = "selfware:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",  # fastapi.testclient
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
